name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Buat proyek Android
        run: |
          mkdir -p app/src/main/java/id/my/poh3/app app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "POH3"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'id.my.poh3.app'
              compileSdk 34
              defaultConfig {
                  applicationId "id.my.poh3.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">POH3</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/white</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/id/my/poh3/app/MainActivity.java <<'EOF'
          package id.my.poh3.app;

          import android.Manifest;
          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.PermissionRequest;
          import android.webkit.URLUtil;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.ProgressBar;

          public class MainActivity extends Activity {

              private static final String START_URL = "https://app.poh3.my.id/";
              private static final String HOST = "app.poh3.my.id";
              private static final int REQ_FILE = 1001;
              private static final int REQ_CAMERA = 1002;

              private WebView webView;
              private ProgressBar progress;
              private ValueCallback<Uri[]> filePathCallback;
              private PermissionRequest pendingWebPermission;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  FrameLayout root = new FrameLayout(this);
                  webView = new WebView(this);
                  root.addView(webView, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));

                  progress = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progress.setMax(100);
                  root.addView(progress, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, 8));
                  setContentView(root);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setSupportZoom(false);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {
                          Uri u = req.getUrl();
                          String scheme = u.getScheme();
                          if (("http".equals(scheme) || "https".equals(scheme))
                                  && HOST.equalsIgnoreCase(u.getHost())) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, u));
                          } catch (Exception ignored) { }
                          return true;
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          progress.setVisibility(View.VISIBLE);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          progress.setVisibility(View.GONE);
                          CookieManager.getInstance().flush();
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest req, WebResourceError err) {
                          if (req.isForMainFrame()) {
                              String html = "<html><head><meta name='viewport' content='width=device-width,initial-scale=1'></head>"
                                      + "<body style='font-family:sans-serif;text-align:center;padding:48px 24px;color:#333'>"
                                      + "<h2>Tidak dapat terhubung</h2>"
                                      + "<p>Periksa koneksi internet Anda lalu coba lagi.</p>"
                                      + "<button style='padding:12px 28px;font-size:16px;border:0;border-radius:8px;background:#1565c0;color:#fff' "
                                      + "onclick=\"location.href='" + START_URL + "'\">Muat ulang</button>"
                                      + "</body></html>";
                              view.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
                          }
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          progress.setProgress(newProgress);
                      }

                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback,
                                                       FileChooserParams params) {
                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                          }
                          filePathCallback = callback;
                          try {
                              startActivityForResult(params.createIntent(), REQ_FILE);
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> {
                              boolean wantsCamera = false;
                              for (String r : request.getResources()) {
                                  if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(r)) wantsCamera = true;
                              }
                              if (wantsCamera && Build.VERSION.SDK_INT >= 23
                                      && checkSelfPermission(Manifest.permission.CAMERA)
                                      != PackageManager.PERMISSION_GRANTED) {
                                  pendingWebPermission = request;
                                  requestPermissions(new String[]{Manifest.permission.CAMERA}, REQ_CAMERA);
                              } else {
                                  request.grant(request.getResources());
                              }
                          });
                      }
                  });

                  webView.setDownloadListener((url, ua, cd, mime, len) -> {
                      try {
                          DownloadManager.Request r = new DownloadManager.Request(Uri.parse(url));
                          r.setMimeType(mime);
                          r.addRequestHeader("Cookie", CookieManager.getInstance().getCookie(url));
                          r.addRequestHeader("User-Agent", ua);
                          r.setNotificationVisibility(
                                  DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          r.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS,
                                  URLUtil.guessFileName(url, cd, mime));
                          ((DownloadManager) getSystemService(DOWNLOAD_SERVICE)).enqueue(r);
                      } catch (Exception e) {
                          try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); }
                          catch (Exception ignored) { }
                      }
                  });

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl(START_URL);
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == REQ_FILE && filePathCallback != null) {
                      Uri[] result = (resultCode == RESULT_OK && data != null)
                              ? WebChromeClient.FileChooserParams.parseResult(resultCode, data) : null;
                      filePathCallback.onReceiveValue(result);
                      filePathCallback = null;
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] results) {
                  if (code == REQ_CAMERA && pendingWebPermission != null) {
                      if (results.length > 0 && results[0] == PackageManager.PERMISSION_GRANTED) {
                          pendingWebPermission.grant(pendingWebPermission.getResources());
                      } else {
                          pendingWebPermission.deny();
                      }
                      pendingWebPermission = null;
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  webView.saveState(out);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: POH3-apk
          path: app/build/outputs/apk/release/*.apk
